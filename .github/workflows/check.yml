name: Synthetic compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: cargo +1.92.0 build --locked --manifest-path reference/Cargo.toml
      - run: python -m pytest -q
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit -r requirements-dev.lock
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file reference/Cargo.lock
      - run: python scripts/check_repository.py
