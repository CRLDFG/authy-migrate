name: Synthetic compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: authy-migrate --help
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: cargo +1.92.0 build --locked --manifest-path reference/Cargo.toml
      - run: cargo +1.92.0 build --locked --manifest-path reference/legacy/Cargo.toml
      - run: python -m pytest -q
      - name: Prepare isolated synthetic capture environment (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          python -m venv .capture-venv
          .capture-venv/bin/python -m pip install --require-hashes -r capture/bootstrap.lock
          .capture-venv/bin/python -m pip install --require-hashes --no-build-isolation -r capture/requirements-macos-arm64.lock
          .capture-venv/bin/python -m pip check
          python capture/audit_environment.py .capture-venv/bin/python
      - name: Actual synthetic TLS capture and lifecycle tests
        if: runner.os == 'macOS'
        env:
          PYTHONPATH: capture:src
        run: python -m pytest -q capture/tests
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit -r requirements-dev.lock
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file reference/Cargo.lock
      - run: cargo audit --file reference/legacy/Cargo.lock
      - run: python scripts/check_repository.py
