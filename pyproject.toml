[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authy-migrate"
version = "0.1.0"
description = "Experimental offline Authy export to encrypted Proton converter"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["cryptography==50.0.1"]

[project.scripts]
authy-migrate = "authy_migrate.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
