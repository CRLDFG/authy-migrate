[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "authy-migrate"
version = "0.0.1"
description = "Offline Proton encrypted-export compatibility prototype (synthetic data only)"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["cryptography==50.0.1"]

[project.scripts]
authy-migrate = "authy_migrate.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
